      - !tagged_iterator atoolo_oparl.indexer.document_enricher.schema2x
      - '@atoolo_oparl.indexer.list_fetcher'
      - '@atoolo_search.indexer.solr_index_service'
      - '@atoolo_oparl.indexer.document_remover'
      - '@atoolo_oparl.indexer.object_filter'
      - '@atoolo_oparl.indexer.state_store'
      - '@atoolo_oparl.indexer.organization.progress_state'
      - '@atoolo_index.indexer.aborter'
      - '@atoolo_index.indexer.configuration_loader'
      - '@atoolo_index.index_name'
      - 'oparl-organization'
      - '@atoolo_index.indexer.php_limit_increaser'
      - '@logger'
      - '@?lock.factory'
    tags:
